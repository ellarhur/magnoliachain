<!DOCTYPE html>
<html lang="sv">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
   <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Magnolia – Logga in</title>
  <link rel="stylesheet" href="./src/css/app.css" />
  <script type="module" src="./src/js/auth.mjs" defer></script>
</head>
<body>
  <main class="auth-container">
    <section class="auth-box">
      <h1>Välkommen till Magnolia-blockkedjan</h1>
      <p>Logga in för att skapa transaktioner och minea block!</p>

      <!-- Login Form -->
      <form id="loginForm" class="auth-form hidden">
        <h3>Logga in</h3>
        <input type="email" name="email" placeholder="E-post" required />
        <input type="password" name="password" placeholder="Lösenord" required />
        <button type="submit" class="btn">Logga in</button>
      </form>

      <form id="registerForm" class="auth-form hidden">
        <h3>Registrera</h3>
        <input type="text" name="firstName" placeholder="Förnamn" required />
        <input type="text" name="lastName" placeholder="Efternamn" required />
        <input type="email" name="email" placeholder="E-post" required />
        <input type="password" name="password" placeholder="Lösenord" required />
        <button type="submit" class="btn">Registrera</button>
      </form>
      
    </section>
  </main>

  <script>
    document.getElementById('loginBtn').addEventListener('click', () => {
      document.getElementById('loginForm').classList.remove('hidden');
      document.getElementById('registerForm').classList.add('hidden');
    });

    document.getElementById('registerBtn').addEventListener('click', () => {
      document.getElementById('registerForm').classList.remove('hidden');
      document.getElementById('loginForm').classList.add('hidden');
    });
  </script>
</body>
</html>
