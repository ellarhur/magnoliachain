<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../app.mjs" defer></script>
    <script src="../js/navbar.mjs" defer></script>
    <script src="../js/auth.mjs" type="module" defer></script>
    <title>Somechain - The official website for the Somechain blockchain.</title>
    <link rel="stylesheet" href="../css/app.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
    <main class="about-container">
        <div class="text-container">
          <h2>Login to the Magnolia blockchain</h2>
          <p>
          Log in to mine now
          </p>
          <div class="auth-buttons">
            <button id="loginBtn" class="btn btn-primary">Log in</button>
            <button id="registerBtn" class="btn btn-secondary">Register</button>
          </div>
          
          <div id="loginForm" class="auth-form hidden">
            <h3>Log in</h3>
            <form id="login">
              <input type="email" name="email" placeholder="E-post" required>
              <input type="password" name="password" placeholder="Lösenord" required>
              <button type="submit" class="btn btn-primary">Log in</button>
            </form>
          </div>

          <div id="registerForm" class="auth-form hidden">
            <h3>Register</h3>
            <form id="register">
              <input type="text" name="username" placeholder="Användarnamn" required>
              <input type="email" name="email" placeholder="E-post" required>
              <input type="password" name="password" placeholder="Lösenord" required>
              <button type="submit" class="btn btn-primary">Register</button>
            </form>
          </div>
        </div>
    </main>

    <script>
        document.getElementById('loginBtn').addEventListener('click', () => {
            document.getElementById('loginForm').classList.remove('hidden');
            document.getElementById('registerForm').classList.add('hidden');
        });

        document.getElementById('registerBtn').addEventListener('click', () => {
            document.getElementById('registerForm').classList.remove('hidden');
            document.getElementById('loginForm').classList.add('hidden');
        });
    </script>
</body>
</html>
