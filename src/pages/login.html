<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../app.mjs" defer></script>
    <script src="../js/navbar.mjs" defer></script>
    <script src="../js/auth.mjs" type="module" defer></script>
    <title>Somechain - The official website for the Somechain blockchain.</title>
    <link rel="stylesheet" href="../css/app.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
    <nav class="navbar">
        <a href="./index.html" class="header-title">The Somechain blockchain</a>
        <div class="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <ul class="nav-menu">
            <li><a href="../../index.html">Home</a></li>
            <li><a href="./about.html">About us</a></li>
            <li><a href="./blockchain.html">The blockchain</a></li>
            <li><a href="./blocks.html">Find a block</a></li>
            <li><a href="./createblock.html">Create a block</a></li>
        </ul>
    </nav>
    <main class="about-container">
        <div class="text-container">
          <h2>About the Somechain blockchain</h2>
          <p>
            Logga in för att komma åt blockkedjan och skapa transaktioner.
          </p>
          <div class="auth-buttons">
            <button id="loginBtn" class="btn btn-primary">Logga in</button>
            <button id="registerBtn" class="btn btn-secondary">Registrera</button>
          </div>
          
          <div id="loginForm" class="auth-form hidden">
            <h3>Logga in</h3>
            <form id="login">
              <input type="email" name="email" placeholder="E-post" required>
              <input type="password" name="password" placeholder="Lösenord" required>
              <button type="submit" class="btn btn-primary">Logga in</button>
            </form>
          </div>

          <div id="registerForm" class="auth-form hidden">
            <h3>Registrera</h3>
            <form id="register">
              <input type="text" name="username" placeholder="Användarnamn" required>
              <input type="email" name="email" placeholder="E-post" required>
              <input type="password" name="password" placeholder="Lösenord" required>
              <button type="submit" class="btn btn-primary">Registrera</button>
            </form>
          </div>
        </div>
    </main>

    <script>
        // Visa/dölj formulär när knapparna klickas
        document.getElementById('loginBtn').addEventListener('click', () => {
            document.getElementById('loginForm').classList.remove('hidden');
            document.getElementById('registerForm').classList.add('hidden');
        });

        document.getElementById('registerBtn').addEventListener('click', () => {
            document.getElementById('registerForm').classList.remove('hidden');
            document.getElementById('loginForm').classList.add('hidden');
        });
    </script>
</body>
</html>
